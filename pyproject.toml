[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "github-achievement-python"
version = "0.2.0"
description = "A Python CLI for GitHub achievement workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
github-achievement = "github_achievement.cli:main"

[tool.setuptools.packages.find]
include = ["github_achievement*"]
